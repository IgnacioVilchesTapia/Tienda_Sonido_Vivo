spring.application.name=backend-tienda-sonido-vivo
server.port=8080

# Configuracion de Conexion MySQL (XAMPP)
spring.datasource.url=jdbc:mysql://localhost:3306/tienda_sonido_vivo?createDatabaseIfNotExist=true&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
